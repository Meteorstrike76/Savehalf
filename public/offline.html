<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#292c24"><title>SaveHalf — Offline list</title><style>body{font:16px system-ui;background:#f7f1e7;color:#292c24;max-width:760px;margin:auto;padding:28px}h1{font-family:Georgia,serif}article{border-bottom:1px solid #cdbda6;padding:16px 0;display:flex;gap:12px}small{display:block;color:#665e55;margin-top:8px}a,button{color:inherit;padding:12px}button{border:1px solid #cdbda6;background:#fff6e8}input{width:22px;height:22px}#notice{padding:16px;border-left:4px solid #a73c28}strong{display:block}</style></head><body><h1>savehalf. Your offline shop.</h1><p id="notice">Offline checklist. Saved prices are last-known estimates and have not been refreshed. Confirm prices and stock when you can.</p><main id="list"></main><p id="total"></p><button id="print">Print list</button><a href="/">Try the live catalogue</a><script>
const key='savehalf-shopping-v1',root=document.getElementById('list'),money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(n);let rows=[];try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))rows=a.slice(0,100).filter(x=>x?.deal&&typeof x.deal.title==='string'&&typeof x.deal.store==='string'&&Number.isFinite(x.deal.discountPrice)&&x.deal.discountPrice>0&&Number.isInteger(x.quantity)&&x.quantity>=1&&x.quantity<=99);}catch{}
function draw(){root.replaceChildren();if(!rows.length)root.textContent='No list is saved on this device. Add products when you are online.';let cents=0;for(const x of rows){cents+=Math.round(x.deal.discountPrice*100)*x.quantity;const card=document.createElement('article'),label=document.createElement('label'),check=document.createElement('input'),text=document.createElement('span'),title=document.createElement('strong'),details=document.createElement('small');check.type='checkbox';check.checked=x.bought===true;check.setAttribute('aria-label','Bought '+x.deal.title);check.onchange=()=>{x.bought=check.checked;try{localStorage.setItem(key,JSON.stringify(rows));}catch{document.getElementById('notice').textContent='Checklist changes could not be saved. Prices remain unverified.';}};title.textContent=x.quantity+' × '+x.deal.title;details.textContent=x.deal.store+' · '+money(x.deal.discountPrice*x.quantity)+' last-known · checked '+(x.deal.lastSeenAt||'unknown');text.append(title,details);label.append(check);card.append(label,text);root.append(card);}document.getElementById('total').textContent='Last-known basket estimate: '+money(cents/100);}draw();document.getElementById('print').onclick=()=>print();
</script></body></html>
