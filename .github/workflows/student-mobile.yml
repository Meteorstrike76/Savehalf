name: Student Pack mobile smoke
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: student-mobile
  cancel-in-progress: false
jobs:
  mobile:
    if: vars.STUDENT_PACK_FREE_PLAN_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tools/student-pack/mobile-smoke.mjs
        env:
          STUDENT_PACK_FREE_PLAN_VERIFIED: ${{ vars.STUDENT_PACK_FREE_PLAN_VERIFIED }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
