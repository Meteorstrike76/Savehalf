name: Validate app
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # Test-only public fixtures. No production account or secrets are needed.
          VITE_SUPABASE_URL: https://savehalf-ci.invalid
          VITE_SUPABASE_ANON_KEY: savehalf-ci-public-fixture
      - run: node --test tests/*.test.cjs
      - run: npm run test:ui
      - run: npm ci --prefix scraper
      - run: npm test --prefix scraper
