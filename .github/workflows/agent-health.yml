name: Weekly bounded agent health
on:
  schedule:
    - cron: '15 21 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: savehalf-agent-health
  cancel-in-progress: false
jobs:
  report:
    if: vars.SAVEHALF_HEALTH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node tools/rollout/health.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAVEHALF_HEALTH_STORES: ${{ vars.SAVEHALF_HEALTH_STORES }}
          SAVEHALF_HEALTH_MAX_AGE_HOURS: ${{ vars.SAVEHALF_HEALTH_MAX_AGE_HOURS }}
          BETTERSTACK_HEARTBEAT_URL: ${{ secrets.BETTERSTACK_HEARTBEAT_URL }}
